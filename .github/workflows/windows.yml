name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redis7:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x

      - name: Install Redis 7
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          redis-server --version

      - name: Test on Redis 7
        run: dotnet test MiniRedis.sln -c Release --verbosity normal --filter "FullyQualifiedName!~Redis5_string_save_is_rejected"

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x

      - name: Start disposable Redis
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "redis.zip"
          $dest = Join-Path $env:RUNNER_TEMP "redis"
          Invoke-WebRequest -Uri "https://github.com/tporadowski/redis/releases/download/v5.0.14.1/Redis-x64-5.0.14.1.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dest
          $exe = Get-ChildItem -Path $dest -Recurse -Filter redis-server.exe | Select-Object -First 1
          if (-not $exe) { throw "redis-server.exe was not in the portable zip" }
          "MINIREDIS_REDIS_SERVER=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore MiniRedis.sln

      - name: Build
        run: dotnet build MiniRedis.sln -c Release --no-restore

      - name: Test
        run: dotnet test MiniRedis.sln -c Release --no-build --verbosity normal --filter "FullyQualifiedName!~Redis7_string_save_keeps_ttl"


      - name: Publish portable directory
        run: dotnet publish src/MiniRedis.App/MiniRedis.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=false -p:IncludeAllContentForSelfExtract=false -p:DebugType=None -p:DebugSymbols=false -o artifacts/win-x64/MiniRedis

      - name: Check directory layout and zip
        shell: pwsh
        run: |
          $dir = "artifacts/win-x64/MiniRedis"
          if (-not (Test-Path "$dir/MiniRedis.exe")) { throw "MiniRedis.exe missing" }
          if (-not (Test-Path "$dir/coreclr.dll")) { throw "coreclr.dll missing; this must be a self-contained directory, not a single-file bundle" }
          if (-not (Test-Path "$dir/hostfxr.dll")) { throw "hostfxr.dll missing" }
          $count = (Get-ChildItem $dir -File -Recurse).Count
          if ($count -lt 20) { throw "publish directory has too few files ($count)" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path $dir -DestinationPath artifacts/MiniRedis-win-x64.zip -Force
          $zip = Get-Item artifacts/MiniRedis-win-x64.zip
          $dirBytes = (Get-ChildItem $dir -File -Recurse | Measure-Object Length -Sum).Sum
          "files=$count" | Tee-Object -FilePath artifacts/package-metrics.txt
          "dir_bytes=$dirBytes" | Tee-Object -FilePath artifacts/package-metrics.txt -Append
          "zip_bytes=$($zip.Length)" | Tee-Object -FilePath artifacts/package-metrics.txt -Append

      - name: UI smoke
        shell: pwsh
        run: |
          $dir = (Resolve-Path "artifacts/win-x64/MiniRedis").Path
          $out = Join-Path (Get-Location) "artifacts/smoke-metrics.txt"
          $exe = Join-Path $dir "MiniRedis.exe"
          # WinExe 没有控制台。直接调用会马上返回，进程还没写出指标就被步骤结束杀掉。
          $p = Start-Process -FilePath $exe -ArgumentList @("--smoke", $out) -WorkingDirectory $dir -PassThru
          if (-not $p.WaitForExit(90000)) {
            try { $p.Kill() } catch {}
            "ok=false`nerror=smoke timed out after 90s" | Set-Content $out
            Get-Content $out
            exit 1
          }
          "exit_code=$($p.ExitCode)" | Add-Content $out
          if (-not (Test-Path $out)) {
            "ok=false`nerror=smoke process produced no metrics file`nexit_code=$($p.ExitCode)" | Set-Content $out
          }
          Get-Content $out
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          $text = Get-Content $out -Raw
          if ($text -notmatch '(?m)^ok=true\s*$') { throw "smoke ok is not true" }
          if ($text -notmatch '(?m)^exit_code=0\s*$') { throw "smoke exit_code is not 0" }
          if ($text -notmatch '(?m)^startup_ms=(\d+)\s*$') { throw "smoke startup_ms missing" }
          if ([int]$Matches[1] -lt 0 -or [int]$Matches[1] -gt 90000) { throw "smoke startup_ms out of range" }
          if ($text -notmatch '(?m)^working_set_bytes=([1-9]\d*)\s*$') { throw "smoke working_set_bytes missing" }

      - name: Upload portable zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MiniRedis-win-x64-portable
          path: |
            artifacts/MiniRedis-win-x64.zip
            artifacts/package-metrics.txt
            artifacts/smoke-metrics.txt
          retention-days: 14
          if-no-files-found: error
