name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x

      - name: Start disposable Redis
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "redis.zip"
          $dest = Join-Path $env:RUNNER_TEMP "redis"
          Invoke-WebRequest -Uri "https://github.com/tporadowski/redis/releases/download/v5.0.14.1/Redis-x64-5.0.14.1.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dest
          $exe = Get-ChildItem -Path $dest -Recurse -Filter redis-server.exe | Select-Object -First 1
          if (-not $exe) { throw "redis-server.exe was not in the portable zip" }
          "MINIREDIS_REDIS_SERVER=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore MiniRedis.sln

      - name: Build
        run: dotnet build MiniRedis.sln -c Release --no-restore

      - name: Test
        run: dotnet test MiniRedis.sln -c Release --no-build --verbosity normal

      - name: Publish portable directory
        run: dotnet publish src/MiniRedis.App/MiniRedis.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=false -p:IncludeAllContentForSelfExtract=false -p:DebugType=None -p:DebugSymbols=false -o artifacts/win-x64/MiniRedis

      - name: Check directory layout and zip
        shell: pwsh
        run: |
          $dir = "artifacts/win-x64/MiniRedis"
          if (-not (Test-Path "$dir/MiniRedis.exe")) { throw "MiniRedis.exe missing" }
          if (-not (Test-Path "$dir/coreclr.dll")) { throw "coreclr.dll missing; this must be a self-contained directory, not a single-file bundle" }
          if (-not (Test-Path "$dir/hostfxr.dll")) { throw "hostfxr.dll missing" }
          $count = (Get-ChildItem $dir -File -Recurse).Count
          if ($count -lt 20) { throw "publish directory has too few files ($count)" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path $dir -DestinationPath artifacts/MiniRedis-win-x64.zip -Force
          $zip = Get-Item artifacts/MiniRedis-win-x64.zip
          "files=$count" | Tee-Object -FilePath artifacts/package-metrics.txt
          "zip_bytes=$($zip.Length)" | Tee-Object -FilePath artifacts/package-metrics.txt -Append

      - name: UI smoke
        continue-on-error: true
        shell: pwsh
        run: |
          & "artifacts/win-x64/MiniRedis/MiniRedis.exe" --smoke "artifacts/smoke-metrics.txt"
          if (-not (Test-Path artifacts/smoke-metrics.txt)) {
            "ok=false`nerror=smoke process produced no metrics file" | Set-Content artifacts/smoke-metrics.txt
          }
          Get-Content artifacts/smoke-metrics.txt

      - name: Upload portable zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MiniRedis-win-x64-portable
          path: |
            artifacts/MiniRedis-win-x64.zip
            artifacts/package-metrics.txt
            artifacts/smoke-metrics.txt
          retention-days: 14
          if-no-files-found: error
